services:
  db:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${DB_NAME:-outlove}
      - POSTGRES_USER=${DB_USER:-outlove}
      - POSTGRES_PASSWORD=${DB_PASSWORD:?Задайте DB_PASSWORD в .env}
    # Только с этой машины (для psql / IDE); снаружи порт закрыт
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U outlove"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    # Порт не публикуется: Redis нужен только контейнерам внутри сети compose
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/app
      - static_volume:/app/static
      - media_volume:/app/media
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,api,dev.phantom-ink.online}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-http://localhost:8000,http://localhost,http://localhost:3000,http://dev.phantom-ink.online,https://dev.phantom-ink.online}
      - DB_NAME=${DB_NAME:-outlove}
      - DB_USER=${DB_USER:-outlove}
      - DB_PASSWORD=${DB_PASSWORD:?Задайте DB_PASSWORD в .env}
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:8080,http://localhost:80,http://localhost:8000,https://dev.phantom-ink.online}
      - SECRET_KEY=${SECRET_KEY:?Задайте SECRET_KEY в .env}
      - DEBUG=${DEBUG:-False}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_STORAGE_BUCKET_NAME=${AWS_STORAGE_BUCKET_NAME:-}
      - AWS_S3_REGION_NAME=${AWS_S3_REGION_NAME:-eu-central-1}
    # Снаружи API доступен только через nginx (:80); 8000 — для локальной отладки
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate &&
             python manage.py init_daily_tasks &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4 --timeout 120"

  # Go-версия API: обслуживает перенесённые разделы (см. go/README.md)
  api-go:
    build:
      context: ./go
    environment:
      - SECRET_KEY=${SECRET_KEY:?Задайте SECRET_KEY в .env}
      - DB_NAME=${DB_NAME:-outlove}
      - DB_USER=${DB_USER:-outlove}
      - DB_PASSWORD=${DB_PASSWORD:?Задайте DB_PASSWORD в .env}
      - DB_HOST=db
      - DB_PORT=5432
      - PORT=8080
      - MEDIA_ROOT=/app/media
    # Тот же том, что у Django: Go сохраняет загрузки, Django их раздаёт.
    # Go работает как nonroot (65532); права на places/ выдаёт media-perms.
    volumes:
      - media_volume:/app/media
    expose:
      - "8080"
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started  # схему создают миграции Django в сервисе api
      media-perms:
        condition: service_completed_successfully

  # Разово выдаёт Go-сервису (uid 65532) права на запись в каталоги, куда он сохраняет файлы
  media-perms:
    image: busybox:1.37
    command: sh -c "mkdir -p /app/media/places && chown 65532:65532 /app/media/places"
    volumes:
      - media_volume:/app/media
    restart: "no"

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A config worker -l info --concurrency=2
    volumes:
      - .:/app
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
      - DB_NAME=${DB_NAME:-outlove}
      - DB_USER=${DB_USER:-outlove}
      - DB_PASSWORD=${DB_PASSWORD:?Задайте DB_PASSWORD в .env}
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:?Задайте SECRET_KEY в .env}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - .:/app
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
      - DB_NAME=${DB_NAME:-outlove}
      - DB_USER=${DB_USER:-outlove}
      - DB_PASSWORD=${DB_PASSWORD:?Задайте DB_PASSWORD в .env}
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:?Задайте SECRET_KEY в .env}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/static
      - media_volume:/media
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
