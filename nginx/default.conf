# Our Love API Gateway
# Routes all requests to the monolith API service
# Serves static and media files directly

upstream django_api {
    server api:8000;
}

# Go-версия API: перенесённые разделы (go/README.md)
upstream go_api {
    server api-go:8080;
}

server {
    listen 80;
    server_name localhost;
    client_max_body_size 50M;

    # Static files — served directly by nginx
    location /static/ {
        alias /static/;
    }

    # Media — только по подписанной ссылке: Django проверяет подпись
    # и отвечает X-Accel-Redirect на /protected-media/
    location /media/ {
        proxy_pass http://django_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;  # не доверяем значению от клиента
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Недоступна напрямую снаружи (internal), только через X-Accel-Redirect
    location /protected-media/ {
        internal;
        alias /media/;
        # Тип по расширению из белого списка, всё прочее — как бинарный файл:
        # загруженный .html не исполнится в браузере на нашем домене
        types {
            image/jpeg jpg jpeg;
            image/png png;
            image/gif gif;
            image/webp webp;
            image/heic heic;
            audio/mp4 m4a;
            audio/aac aac;
            audio/mpeg mp3;
            audio/wav wav;
            audio/ogg ogg oga opus;
            audio/x-caf caf;
            audio/3gpp 3gp;
        }
        default_type application/octet-stream;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
    }

    # Разделы, перенесённые на Go. Regex-локации nginx имеют приоритет над префиксом /api/.
    location ~ ^/api/v1/(moods|dates|places)/ {
        proxy_pass http://go_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;  # не доверяем значению от клиента
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # API — all requests proxied to Django
    location /api/ {
        proxy_pass http://django_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;  # не доверяем значению от клиента
        proxy_set_header X-Forwarded-Proto $scheme;

        # CORS headers for preflight requests
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept" always;
        add_header Access-Control-Allow-Credentials true always;

        if ($request_method = OPTIONS) {
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }
    }

    # Admin panel
    location /admin/ {
        proxy_pass http://django_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;  # не доверяем значению от клиента
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check — статический ответ от nginx, не требует Django
    location /health/ {
        return 200 "{\"status\": \"OK\", \"service\": \"api\", \"version\": \"1.0.0\"}";
        add_header Content-Type application/json;
    }
}
