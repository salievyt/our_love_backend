version: '3.8'

# Our Love — Microservices Architecture
# Each service has its own database for isolation.
# If one service crashes, others continue working.
# Nginx routes requests via /api/v1/{service}/*

x-service-base: &service-base
  build:
    context: .
    dockerfile: services/${SERVICE_NAME}-service/Dockerfile
  volumes:
    - .:/app
    - static_volume:/static
    - media_volume:/media
  environment: &service-env
    - DJANGO_SETTINGS_MODULE=config.settings
    - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
    - DEBUG=${DEBUG:-False}
    - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:8080}
    - DB_USER=${DB_USER:-outlove}
    - DB_PASSWORD=${DB_PASSWORD:-outlove_secret}
  depends_on:
    redis:
      condition: service_healthy

services:
  # ============================================
  # DATABASES — отдельная БД для каждого сервиса
  # ============================================
  auth-db:
    image: postgres:16-alpine
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=outlove_auth
      - POSTGRES_USER=${DB_USER:-outlove}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-outlove_secret}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U outlove"]
      interval: 5s
      timeout: 5s
      retries: 5

  album-db:
    image: postgres:16-alpine
    volumes:
      - album_postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=outlove_album
      - POSTGRES_USER=${DB_USER:-outlove}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-outlove_secret}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U outlove"]
      interval: 5s
      timeout: 5s
      retries: 5

  task-db:
    image: postgres:16-alpine
    volumes:
      - task_postgres_data:/var/lib/postgresql/data
    environment: &pg-env
      - POSTGRES_DB=outlove_task
      - POSTGRES_USER=${DB_USER:-outlove}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-outlove_secret}
    healthcheck: &pg-healthcheck
      test: ["CMD-SHELL", "pg_isready -U outlove"]
      interval: 5s
      timeout: 5s
      retries: 5

  question-db:
    image: postgres:16-alpine
    volumes:
      - question_postgres_data:/var/lib/postgresql/data
    environment:
      <<: *pg-env
      POSTGRES_DB: outlove_question
    healthcheck: *pg-healthcheck

  diary-db:
    image: postgres:16-alpine
    volumes:
      - diary_postgres_data:/var/lib/postgresql/data
    environment:
      <<: *pg-env
      POSTGRES_DB: outlove_diary
    healthcheck: *pg-healthcheck

  mood-db:
    image: postgres:16-alpine
    volumes:
      - mood_postgres_data:/var/lib/postgresql/data
    environment:
      <<: *pg-env
      POSTGRES_DB: outlove_mood
    healthcheck: *pg-healthcheck

  place-db:
    image: postgres:16-alpine
    volumes:
      - place_postgres_data:/var/lib/postgresql/data
    environment:
      <<: *pg-env
      POSTGRES_DB: outlove_place
    healthcheck: *pg-healthcheck

  capsule-db:
    image: postgres:16-alpine
    volumes:
      - capsule_postgres_data:/var/lib/postgresql/data
    environment:
      <<: *pg-env
      POSTGRES_DB: outlove_capsule
    healthcheck: *pg-healthcheck

  date-db:
    image: postgres:16-alpine
    volumes:
      - date_postgres_data:/var/lib/postgresql/data
    environment:
      <<: *pg-env
      POSTGRES_DB: outlove_date
    healthcheck: *pg-healthcheck

  # ============================================
  # REDIS — общий для всех сервисов (кэш + Celery)
  # ============================================
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================
  # AUTH SERVICE — порт 8001
  # ============================================
  auth-service:
    <<: *service-base
    ports: ["8001:8001"]
    environment:
      <<: *service-env
      SERVICE_NAME: auth
      DB_HOST: auth-db
      DB_PORT: 5432
    depends_on:
      auth-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8001"

  # ============================================
  # ALBUM SERVICE — порт 8002
  # ============================================
  album-service:
    <<: *service-base
    ports: ["8002:8002"]
    environment:
      <<: *service-env
      SERVICE_NAME: album
      DB_HOST: album-db
      DB_PORT: 5432
    depends_on:
      album-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8002"

  # ============================================
  # TASK SERVICE — порт 8003
  # ============================================
  task-service:
    <<: *service-base
    ports: ["8003:8003"]
    environment:
      <<: *service-env
      SERVICE_NAME: task
      DB_HOST: task-db
      DB_PORT: 5432
    depends_on:
      task-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8003"

  # ============================================
  # QUESTION SERVICE — порт 8004
  # ============================================
  question-service:
    <<: *service-base
    ports: ["8004:8004"]
    environment:
      <<: *service-env
      SERVICE_NAME: question
      DB_HOST: question-db
      DB_PORT: 5432
    depends_on:
      question-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8004"

  # ============================================
  # DIARY SERVICE — порт 8005
  # ============================================
  diary-service:
    <<: *service-base
    ports: ["8005:8005"]
    environment:
      <<: *service-env
      SERVICE_NAME: diary
      DB_HOST: diary-db
      DB_PORT: 5432
    depends_on:
      diary-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8005"

  # ============================================
  # MOOD SERVICE — порт 8006
  # ============================================
  mood-service:
    <<: *service-base
    ports: ["8006:8006"]
    environment:
      <<: *service-env
      SERVICE_NAME: mood
      DB_HOST: mood-db
      DB_PORT: 5432
    depends_on:
      mood-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8006"

  # ============================================
  # PLACE SERVICE — порт 8007
  # ============================================
  place-service:
    <<: *service-base
    ports: ["8007:8007"]
    environment:
      <<: *service-env
      SERVICE_NAME: place
      DB_HOST: place-db
      DB_PORT: 5432
    depends_on:
      place-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8007"

  # ============================================
  # CAPSULE SERVICE — порт 8008
  # ============================================
  capsule-service:
    <<: *service-base
    ports: ["8008:8008"]
    environment:
      <<: *service-env
      SERVICE_NAME: capsule
      DB_HOST: capsule-db
      DB_PORT: 5432
    depends_on:
      capsule-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8008"

  # ============================================
  # DATE SERVICE — порт 8009
  # ============================================
  date-service:
    <<: *service-base
    ports: ["8009:8009"]
    environment:
      <<: *service-env
      SERVICE_NAME: date
      DB_HOST: date-db
      DB_PORT: 5432
    depends_on:
      date-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8009"

  # ============================================
  # NGINX API GATEWAY — порт 80
  # ============================================
  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/static
      - media_volume:/media
    ports:
      - "80:80"
    depends_on:
      - auth-service
      - album-service
      - task-service
      - question-service
      - diary-service
      - mood-service
      - place-service
      - capsule-service
      - date-service

# ============================================
# VOLUMES
# ============================================
volumes:
  auth_postgres_data:
  album_postgres_data:
  task_postgres_data:
  question_postgres_data:
  diary_postgres_data:
  mood_postgres_data:
  place_postgres_data:
  capsule_postgres_data:
  date_postgres_data:
  redis_data:
  static_volume:
  media_volume:
